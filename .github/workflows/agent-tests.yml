name: agent-tests

on:
  push:
    branches: [main]
    paths:
      - "components/minimal-agent/**"
      - ".cargo/config.toml"
      - "xtask/**"
      - "harnesses/shared/scripts/fetch-wit.mjs"
      - "harnesses/shared/scripts/build-helpers.mjs"
      - "tests/**"
      - "wit/wkg-registries.toml"
      - ".github/workflows/agent-tests.yml"
  pull_request:
    paths:
      - "components/minimal-agent/**"
      - ".cargo/config.toml"
      - "xtask/**"
      - "harnesses/shared/scripts/fetch-wit.mjs"
      - "harnesses/shared/scripts/build-helpers.mjs"
      - "tests/**"
      - "wit/wkg-registries.toml"
      - ".github/workflows/agent-tests.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTUP_TOOLCHAIN: "1.97.1"

jobs:
  test:
    name: agent tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain and the wasm target
        run: rustup toolchain install "${{ env.RUSTUP_TOOLCHAIN }}" --profile minimal --target wasm32-wasip2

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3 # zizmor: ignore[cache-poisoning] -- nothing built here is published
        with:
          workspaces: tests/runner

      - name: Install wkg
        run: cargo install --locked wkg@0.16.0

      - name: Run agent tests
        run: cargo xtask agent-tests
