# A negative grant test. The model asks for a tool the agent was not granted.
# The host refuses it, and the test checks the host's record of that refusal,
# not what the model said about it.
version: 1
name: a tool that is not granted is refused and never runs
agent:
  component: ../target/wasm32-wasip2/release/minimal_agent.wasm
grants:
  tools: [echo]
tools:
  - name: echo
    results:
      - output: hello
  - name: delete_file
    description: Delete a file
    results:
      - output: deleted
model:
  replies:
    - tool-calls:
        - name: delete_file
          arguments: {path: /home/me/notes.txt}
    - text: I could not delete it.
run:
  message: tidy up my notes
expect:
  outcome: done
  tool-calls: []
  refused:
    - tool: delete_file
      by: agent
  never:
    calls: [delete_file]
  model-calls: 2
