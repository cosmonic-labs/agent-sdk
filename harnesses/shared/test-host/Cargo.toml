[package]
name = "test-host"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
# The async component runtime, pinned; bump deliberately.
wasmtime = { version = "=50.0.1", default-features = false, features = ["anyhow", "component-model-async", "cranelift", "parallel-compilation", "std"] }
wasmtime-wasi = { version = "=50.0.1", default-features = false, features = ["p2", "p3"] }
# A harness that exports an HTTP handler imports wasi:http/types; nothing
# here serves or sends a request.
wasmtime-wasi-http = { version = "=50.0.1", default-features = false, features = ["p3"] }
http = "1"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "time", "sync"] }
serde_json = "1"

# Not part of any Rust workspace: it pins its own lock.
[workspace]

[profile.dev]
opt-level = 1
debug = 0
