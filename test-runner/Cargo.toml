[package]
name = "agent-test"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Deterministic tests for agents built on cosmonic:agent: a scripted model, granted tools and assertions on what the host recorded."
license = "Apache-2.0"
repository = "https://github.com/cosmonic-labs/agent-sdk"

[lib]
path = "src/lib.rs"

[[bin]]
name = "agent-test"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytes = "1"
http = "1"
http-body-util = "0.1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# YAML for the test files. serde_yaml is archived; this is its maintained fork.
serde_yaml_ng = "0.9"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "time", "sync"] }
# The async component runtime, pinned; bump deliberately.
wasmtime = { version = "=50.0.1", default-features = false, features = ["anyhow", "component-model-async", "cranelift", "parallel-compilation", "std"] }
wasmtime-wasi = { version = "=50.0.1", default-features = false, features = ["p2", "p3"] }
# Without `default-send-request`: the runner has no way to reach a network.
# Every outbound request is answered by the runner's own gate.
wasmtime-wasi-http = { version = "=50.0.1", default-features = false, features = ["p2", "p3"] }

# Not part of any Rust workspace: it pins its own lock.
[workspace]

[profile.dev]
opt-level = 1
debug = 0
