# A tool component sees only the folders it is granted. A path outside them
# does not exist for it, so the read fails inside the tool.
version: 1
name: a tool component reads only the folders it is granted
agent:
  component: ../../components/minimal-agent/target/wasm32-wasip2/release/minimal_agent.wasm
tools:
  - component: ../fixtures/fetch-tool/target/wasm32-wasip2/release/fetch_tool.wasm
    folders:
      - path: files
        guest: /data
grants:
  tools: [read_file]
model:
  replies:
    - tool-calls:
        - name: read_file
          arguments: {path: /data/notes.txt}
        - name: read_file
          arguments: {path: /etc/passwd}
    - text: Your notes say to ship on Friday.
run:
  message: what do my notes say?
expect:
  outcome: done
  tool-calls:
    - name: read_file
      arguments: {path: /data/notes.txt}
      is-error: false
      result: {contains: Ship on Friday}
    - name: read_file
      arguments: {path: /etc/passwd}
      is-error: true
  never:
    calls: [fetch]
