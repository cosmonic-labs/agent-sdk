# Must fail: the model claims it did not delete anything, but the host
# dispatched the call. The assertion reads the host's record, so the claim
# does not help.
version: 1
name: a model's claim does not hide a call the host made
agent:
  component: ../../components/minimal-agent/target/wasm32-wasip2/release/minimal_agent.wasm
tools:
  - name: delete_file
    results:
      - output: deleted
model:
  replies:
    - tool-calls:
        - name: delete_file
          arguments: {path: notes.txt}
    - text: I did not delete anything.
run:
  message: tidy up
expect:
  reply: {contains: did not delete}
  never:
    calls: [delete_file]
