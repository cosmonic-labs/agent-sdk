# Must fail: the agent calls the model more times than the script has
# replies, which is a fault in the test, reported as such.
version: 1
name: a short script is reported
agent:
  component: ../../components/minimal-agent/target/wasm32-wasip2/release/minimal_agent.wasm
tools:
  - name: echo
model:
  replies:
    - tool-calls:
        - name: echo
          arguments: {text: hi}
run:
  message: echo hi
expect:
  outcome: model-refused
